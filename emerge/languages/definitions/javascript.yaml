# emerge/languages/definitions/javascript.yaml
# JavaScript language definition for emerge code analysis tool

name: javascript
display_name: JavaScript
extensions: [.js, .jsx, .mjs, .cjs]

# Package manifest configuration
manifest:
  file: package.json
  format: json

  # Module resolution
  module_resolution:
    type: node                        # Node.js resolution algorithm
    main_field: "main"                # Entry point field
    exports_field: "exports"          # Modern exports map

  # Dependency information
  dependencies:
    runtime: "dependencies"
    dev: "devDependencies"
    peer: "peerDependencies"
    optional: "optionalDependencies"

comments:
  line: "//"
  block_start: "/*"
  block_end: "*/"

token_mappings:
  ":": " : "
  ";": " ; "
  "{": " { "
  "}": " } "
  "(": " ( "
  ")": " ) "
  "[": " [ "
  "]": " ] "
  "?": " ? "
  "!": " ! "
  ",": " , "
  "<": " < "
  ">": " > "
  '"': ' " '
  "'": " ' "

patterns:
  # Import extraction
  imports:
    # ES6 imports: import X from 'module'
    - regex: "import\\s+(?:[^;]+?)\\s+from\\s+['\"]([^'\"]+)['\"]"
      group: 1
    # CommonJS require: require('module')
    - regex: "require\\s*\\(\\s*['\"]([^'\"]+)['\"]\\s*\\)"
      group: 1
    # Dynamic imports: import('module')
    - regex: "import\\s*\\(\\s*['\"]([^'\"]+)['\"]\\s*\\)"
      group: 1

  # Entity extraction (classes, functions)
  entities:
    - regex: "class\\s+([A-Za-z_$][A-Za-z0-9_$]*)"
      group: 1
      type: class
    - regex: "function\\s+([A-Za-z_$][A-Za-z0-9_$]*)\\s*\\("
      group: 1
      type: function

  # Inheritance
  inheritance:
    extends:
      regex: "\\bextends\\s+([A-Za-z_$][A-Za-z0-9_$]*)"
      group: 1

# TF-IDF stopwords for JavaScript
tfidf_stopwords:
  - import
  - export
  - from
  - require
  - module
  - exports
  - const
  - let
  - var
  - function
  - return
  - class
  - extends
  - constructor
  - this
  - super
  - new
  - async
  - await
  - if
  - else
  - for
  - while
  - do
  - switch
  - case
  - default
  - break
  - continue
  - try
  - catch
  - finally
  - throw
  - typeof
  - instanceof
  - null
  - undefined
  - true
  - false
  - void
  - delete
  - in
  - of
  - static
  - get
  - set
  - yield
  - arguments
  - prototype
  - Object
  - Array
  - String
  - Number
  - Boolean
  - Function
  - Symbol
  - Promise
  - Map
  - Set
  - console
  - log
  - error
  - warn
