# emerge/languages/definitions/typescript.yaml
# TypeScript language definition for emerge code analysis tool

name: typescript
display_name: TypeScript
extensions: [.ts, .tsx]

comments:
  line: "//"
  block_start: "/*"
  block_end: "*/"

token_mappings:
  ":": " : "
  ";": " ; "
  "{": " { "
  "}": " } "
  "(": " ( "
  ")": " ) "
  "[": " [ "
  "]": " ] "
  "?": " ? "
  "!": " ! "
  ",": " , "
  "<": " < "
  ">": " > "
  '"': ' " '
  "'": " ' "

patterns:
  # Import extraction
  imports:
    # ES6 imports: import X from 'module'
    - regex: "import\\s+(?:[^;]+?)\\s+from\\s+['\"]([^'\"]+)['\"]"
      group: 1
    # Type imports: import type { X } from 'module'
    - regex: "import\\s+type\\s+(?:[^;]+?)\\s+from\\s+['\"]([^'\"]+)['\"]"
      group: 1
    # CommonJS require: require('module')
    - regex: "require\\s*\\(\\s*['\"]([^'\"]+)['\"]\\s*\\)"
      group: 1
    # Dynamic imports
    - regex: "import\\s*\\(\\s*['\"]([^'\"]+)['\"]\\s*\\)"
      group: 1

  # Entity extraction
  entities:
    - regex: "(?:abstract\\s+)?class\\s+([A-Za-z_$][A-Za-z0-9_$]*)"
      group: 1
      type: class
    - regex: "interface\\s+([A-Za-z_$][A-Za-z0-9_$]*)"
      group: 1
      type: interface
    - regex: "type\\s+([A-Za-z_$][A-Za-z0-9_$]*)\\s*="
      group: 1
      type: type_alias
    - regex: "enum\\s+([A-Za-z_$][A-Za-z0-9_$]*)"
      group: 1
      type: enum
    - regex: "function\\s+([A-Za-z_$][A-Za-z0-9_$]*)\\s*(?:<[^>]*>)?\\s*\\("
      group: 1
      type: function

  # Inheritance
  inheritance:
    extends:
      regex: "\\bextends\\s+([A-Za-z_$][A-Za-z0-9_$]*)"
      group: 1
    implements:
      regex: "\\bimplements\\s+([^{]+)"
      group: 1
      split: ","

# TF-IDF stopwords for TypeScript
tfidf_stopwords:
  - import
  - export
  - from
  - require
  - module
  - const
  - let
  - var
  - function
  - return
  - class
  - interface
  - type
  - enum
  - extends
  - implements
  - constructor
  - this
  - super
  - new
  - async
  - await
  - if
  - else
  - for
  - while
  - do
  - switch
  - case
  - default
  - break
  - continue
  - try
  - catch
  - finally
  - throw
  - typeof
  - instanceof
  - null
  - undefined
  - true
  - false
  - void
  - never
  - any
  - unknown
  - string
  - number
  - boolean
  - object
  - symbol
  - bigint
  - readonly
  - private
  - public
  - protected
  - static
  - abstract
  - as
  - is
  - keyof
  - infer
  - declare
  - namespace
  - Promise
  - Array
  - Map
  - Set
  - Record
  - Partial
  - Required
  - Readonly
  - Pick
  - Omit
