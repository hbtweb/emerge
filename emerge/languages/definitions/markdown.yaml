# emerge/languages/definitions/markdown.yaml
# Markdown language definition for emerge code analysis tool
# Enables documentation structure analysis and code-doc correlation

name: markdown
display_name: Markdown
extensions: [.md, .markdown, .mdx, .mdown, .mkd]

comments:
  # HTML comments in markdown
  block_start: "<!--"
  block_end: "-->"

token_mappings:
  "[": " [ "
  "]": " ] "
  "(": " ( "
  ")": " ) "
  "#": " # "
  "*": " * "
  "_": " _ "
  "`": " ` "
  "|": " | "
  ">": " > "

patterns:
  # Imports = links to other files, internal references
  imports:
    # [link text](path/to/file.md)
    - regex: "\\[([^\\]]+)\\]\\(([^)]+\\.md(?:x)?)\\)"
      group: 2
    # [link text](./relative/path.md)
    - regex: "\\[([^\\]]+)\\]\\(\\./([^)]+)\\)"
      group: 2
    # [link text](#anchor) - internal anchor links
    - regex: "\\[([^\\]]+)\\]\\(#([^)]+)\\)"
      group: 2
      transform: "prefix('#')"
    # Reference-style links: [text][ref]
    - regex: "\\[([^\\]]+)\\]\\[([^\\]]+)\\]"
      group: 2
    # Code references: `ClassName` or `function_name` (PascalCase or snake_case)
    - regex: "`([A-Z][a-zA-Z0-9_]+)`"
      group: 1
      type: code_reference
    # File path references in prose: `path/to/file.ext`
    - regex: "`([a-zA-Z0-9_/.-]+\\.[a-zA-Z]+)`"
      group: 1
      type: file_reference

  # Entities = document structure (headings, sections)
  entities:
    # # Heading 1
    - regex: "^#\\s+(.+)$"
      group: 1
      type: h1
    # ## Heading 2
    - regex: "^##\\s+(.+)$"
      group: 1
      type: h2
    # ### Heading 3
    - regex: "^###\\s+(.+)$"
      group: 1
      type: h3
    # #### Heading 4
    - regex: "^####\\s+(.+)$"
      group: 1
      type: h4
    # ##### Heading 5
    - regex: "^#####\\s+(.+)$"
      group: 1
      type: h5
    # ###### Heading 6
    - regex: "^######\\s+(.+)$"
      group: 1
      type: h6
    # Setext-style H1: underlined with ===
    - regex: "^(.+)\\n=+$"
      group: 1
      type: h1_setext
    # Setext-style H2: underlined with ---
    - regex: "^(.+)\\n-+$"
      group: 1
      type: h2_setext

  # Module = document title (first H1)
  module:
    regex: "^#\\s+(.+)$"
    group: 1

  # Methods = code blocks (fenced) - for analyzing embedded code
  methods:
    # ```language ... ``` - fenced code blocks
    - regex: "^```([a-zA-Z0-9_+-]*)\\s*$"
      group: 1
      type: code_block
    # Indented code blocks (4 spaces)
    - regex: "^    (.+)$"
      group: 1
      type: indented_code

